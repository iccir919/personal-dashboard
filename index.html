<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="index.css">
        <title>Personal Dashboard</title>
    </head>
    <body>
        <main>
            <div class="layout-col left-col">
                <section>
                    <h1 class="app-title">Personal Dashboard</h1>
                </section>
                <section id="most-frequent-websites-section">
                    <h2 class="section-heading">Top 10 Recently Frequently Visited Websites</h2>
                    <ol id="frequent-websites-container">

                    </ol>
                </section>
            </div>  
            <div class="layout-col mid-col">
                <section id="moon-section">
                    <div class="moon-container">
                        <div class="moon-light" id="moon-light"></div>
                        <div class="moon-shadow" id="moon-shadow"></div>
                    </div>
                    <p><span id="current-phase"></span> · <span id="illumination"></span></p>
                    <div id="moon-timeline" class="moon-timeline"></div>
                    <p>Sunrise <span id="sunrise"></span> · Sunset <span id="sunset"></span></p>
                </section>
                <section class="time-container">
                    <h2 id="time-text"></h2>
                    <p id="date-text"></p>
                </section>
                <section class="current-location-section">
                    <header>
                        <h2 id="current-location-heading" class="section-heading">Enter your ZIP code:</h2>
                        <span id="current-location-result"></span>
                        <button type="button" id="change-location-btn" class="text-button" hidden>Change</button>
                    </header>
                    <form id="zip-code-form">
                        <label for="zipcode-input">ZIP Code:</label>
                        <input type="text" id="zipcode-input" name="zipcode" pattern="\d{5}" maxlength="5" inputmode="numeric" required>
                        <button type="submit">Submit</button>
                        <button type="button" id="cancel-zip-btn" class="text-button" hidden>Cancel</button>
                    </form>
                </section>
            </div>
            <div class="layout-col right-col">
                <section id="weather-section">
                    <header>
                        <h2 class="section-heading">Weather</h2>
                    </header>
                    <div id="forecast-container">
                        <h3>Right Now</h3>
                        <div id="current-forecast-container">
                        </div>
                        <h3 id="future-forecast-heading">Next 6 Days</h3>
                        <div id="future-forecast-container">
                        </div>
                    </div>
                    <p id="weather-last-updated"></p>
                </section>
            </div>
        </main>
        <script src="index.js"></script>
    </body>
</html>
