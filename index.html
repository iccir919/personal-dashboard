<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="stylesheet" href="index.css">
        <title>Personal Dashboard</title>
    </head>
    <body>
        <main>
            <!-- Left: title and top sites -->
            <div class="layout-col left-col">
                <section>
                    <h1 class="app-title">Personal Dashboard</h1>
                </section>

                <section id="most-frequent-websites-section">
                    <h2 class="section-heading">Top Sites</h2>
                    <ol id="frequent-websites-container"></ol>
                    <button type="button" id="unhide-sites-btn" class="text-button" hidden></button>
                </section>
            </div>

            <!-- Middle: moon, time, date -->
            <div class="layout-col mid-col">
                <section id="moon-section">
                    <div class="moon-container">
                        <div class="moon-light" id="moon-light"></div>
                        <div class="moon-shadow" id="moon-shadow"></div>
                    </div>
                    <p><span id="current-phase"></span> · <span id="illumination"></span></p>
                    <div id="moon-timeline" class="moon-timeline"></div>
                    <p>Sunrise <span id="sunrise"></span> · Sunset <span id="sunset"></span></p>
                </section>

                <section class="time-container">
                    <h2 id="time-text"></h2>
                    <p id="date-text"></p>
                </section>
            </div>

            <!-- Right: location and weather -->
            <div class="layout-col right-col">
                <h2 class="section-heading">Weather</h2>

                <section class="current-location-section">
                    <h2 id="current-location-heading" class="location-label">Enter your ZIP code</h2>
                    <div id="location-row" class="location-row" hidden>
                        <div id="location-switcher" class="location-switcher"></div>
                        <button type="button" id="change-location-btn" class="text-button">+ Add</button>
                    </div>
                    <form id="zip-code-form" class="zip-form">
                        <input type="text" id="zipcode-input" name="zipcode" aria-label="ZIP code" placeholder="ZIP code" pattern="\d{5}" maxlength="5" inputmode="numeric" required>
                        <button type="submit" class="text-button">Save</button>
                        <button type="button" id="cancel-zip-btn" class="text-button" hidden>Cancel</button>
                    </form>
                    <p id="current-location-result" class="location-status"></p>
                </section>

                <section id="weather-section">
                    <div id="forecast-container">
                        <h3 id="future-forecast-heading">Forecast</h3>
                        <!-- One dropdown row per day; filled in by render7DayWeatherForecast -->
                        <div id="future-forecast-container"></div>
                    </div>

                    <p id="weather-last-updated"></p>
                </section>
            </div>
        </main>

        <script type="module" src="js/main.js"></script>
    </body>
</html>
